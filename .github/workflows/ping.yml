name: ping
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ping
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping endpoints
        run: |
          fail=0
          for url in \
            https://awire.pplx.app/port/5000/api/tape \
            https://awire.pplx.app/ \
            https://tickerwire-verifier.onrender.com/health; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 10 --retry-all-errors --max-time 60 "$url") || code=000
            echo "$url -> $code"
            case "$code" in 2*|3*) ;; *) fail=1 ;; esac
          done
          exit $fail
      # GitHub disables scheduled workflows after 60 days without repository activity.
      # Commit a timestamp when the last one is 7+ days old (and on manual runs) so the schedule stays active.
      - name: Weekly keep-active commit
        if: always()
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo
          cd repo
          last=$(date -u -d "$(cat last-active.txt 2>/dev/null || echo 1970-01-01)" +%s 2>/dev/null || echo 0)
          age=$(( $(date -u +%s) - last ))
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$age" -lt 604800 ]; then
            echo "last keep-active commit ${age}s ago; nothing to do"; exit 0
          fi
          date -u +%Y-%m-%dT%H:%M:%SZ > last-active.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-active.txt
          git commit -m "keep schedule active" && git push || echo "nothing to commit"
